name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
    paths-ignore: ['*.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: KINGPOKY
  REPO_DESC: Nonton Gratis
  # Modul biasa yang ikut dibangun dan diterbitkan. Tambahkan nama modul di sini
  # setelah menaikkan `version` di <Modul>/build.gradle.kts. Kosongkan bila tidak
  # ada modul biasa yang berubah; Moviebox punya jalur sendiri.
  PUBLISH_MODULES: "Dubbindo"
  # Modul yang DIHAPUS dari katalog pada run ini. Isi hanya saat benar-benar
  # mencabut plugin, lalu KOSONGKAN lagi setelah run berhasil — kalau dibiarkan
  # terisi, run berikutnya gagal karena entri sudah tidak ada di katalog.
  REMOVE_MODULES: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout distribution
        uses: actions/checkout@v4
        with:
          path: builds

      - name: Use existing builds history
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Create local.properties
        run: touch "$GITHUB_WORKSPACE/src/local.properties"

      - name: Verify Moviebox source parity and playback regressions
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 Moviebox/tests/verify_migration.py
          python3 Moviebox/tests/run_regression.py
          python3 -m unittest discover -s Moviebox/tests/diagnostics -p 'test_*.py'
          python3 -m unittest discover -s Moviebox/tests -p 'test_distribution.py'
          python3 Moviebox/tests/distribution.py snapshot "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/distribution-before.json"

      - name: Remove retired modules from the catalog
        if: env.REMOVE_MODULES != ''
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 Moviebox/tests/distribution.py remove-modules "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/distribution-before.json"
          python3 Moviebox/tests/distribution.py snapshot "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/distribution-before.json"

      - name: Compile Moviebox and the modules being published
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew :Moviebox:assembleRelease
          for module in $PUBLISH_MODULES; do
            ./gradlew ":$module:assembleRelease"
          done
          ./gradlew makePluginsJson

      - name: Stage only Moviebox and verify the complete release
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 Moviebox/tests/distribution.py prepare "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/distribution-before.json"
          python3 Moviebox/tests/verify_migration.py

      - name: Publish ordinary modules and verify the complete release
        if: env.PUBLISH_MODULES != ''
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 Moviebox/tests/distribution.py publish-extra "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/distribution-before.json"

      - name: Preserve repository identity
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ ! -f repo.json ]; then
            cat > repo.json << EOF_REPO
          {
            "name": "$REPO_NAME",
            "iconUrl": "https://repo.kingpoky.my.id/cloudstream/icon.png",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": ["https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"]
          }
          EOF_REPO
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('repo.json').read_text())
          expected = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/builds/plugins.json'
          assert data['pluginLists'] == [expected], 'Incorrect distribution repository URL'
          PY

      - name: Publish without rewriting history
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 Moviebox/tests/distribution.py verify "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/distribution-before.json"
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No distribution changes."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds
